#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx8192M
kotlin.native.jvmArgs=-Xmx16384M
kotlin.mpp.enableCInteropCommonization=true

#Gradle
# 12G is what the Release/arm64 archive needs — the whole-program Kotlin/Native pass runs INSIDE
# this daemon and was measured at 10.6G peak heap used on 2026-08-15 (clean linkReleaseFrameworkIosArm64;
# it OOMed at 8G on 2026-07-31). Don't lower this; Android and simulator builds prove nothing here.
# Overlapping builds spawn a second daemon and can exhaust a 24G machine — one build at a time.
# The G1 periodic flags make the idle daemon return heap to the OS ~5 min after a build instead of
# squatting at its ~14G peak RSS for hours. InvokesConcurrent must stay OFF: a concurrent cycle
# neither clears Gradle's soft-ref caches nor uncommits (verified 2026-08-15); the periodic FULL GC
# does both, and never fires during a build (builds GC constantly, so the 5-min quiet gate never opens).
org.gradle.jvmargs=-Xmx16384M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=2048m -XX:+UseG1GC -XX:G1PeriodicGCInterval=300000 -XX:-G1PeriodicGCInvokesConcurrent
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# Optional explicit discovery for JDK 21 installations outside Gradle's standard search paths
# (for example Homebrew). JAVA_HOME can stay on the JDK used by native/app builds.
org.gradle.java.installations.fromEnv=TUVORA_TEST_JAVA_HOME
