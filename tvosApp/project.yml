# Apple TV app. Generate the Xcode project with `xcodegen generate` (the .xcodeproj is not committed).
# The shared Kotlin comes from ../tvosCore (NuvioMobile's own code compiled in place for tvOS).
name: TuvoraTV
options:
  bundleIdPrefix: com.tuvora
  deploymentTarget: { tvOS: "17.5" }
packages:
  # Our MPVKit fork (git submodule at NuvioMobile/MPVKit): libmpv + FFmpeg, LGPL build, tvOS slices.
  MPVKit: { path: ../MPVKit }
  # Same SDK and version floor as the iPhone app (crash autocapture works on tvOS via POSIX signals).
  PostHog: { url: https://github.com/PostHog/posthog-ios.git, majorVersion: 3.63.1 }
configFiles:
  Debug: Configuration/TuvoraTV.xcconfig
  Release: Configuration/TuvoraTV.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  TuvoraTV:
    type: application
    platform: tvOS
    sources:
      - TuvoraTV/Sources
      - TuvoraTV/Assets.xcassets
      - TuvoraTV/Resources
      - Shared
      # libmpv/libass renders subtitles only with a font it can find: the same Noto Sans CJK the iOS
      # app bundles (MPVPlayerBridge.configureBundledSubtitleFont), shared rather than copied.
      - path: ../iosApp/iosApp/Resources/Fonts/NotoSansCJKsc-Regular.otf
        buildPhase: resources
      # PostHog setup + event scrubbing, one file for both Apple apps.
      - ../iosApp/iosApp/TuvoraTelemetry.swift
    dependencies:
      - package: MPVKit
        product: MPVKit
      - package: PostHog
        product: PostHog
      - target: TuvoraTopShelf
    info:
      path: TuvoraTV/Info.plist
      properties:
        CFBundleDisplayName: Tuvora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only HTTPS/TLS from the OS — exempt, so TestFlight skips the export-compliance question.
        ITSAppUsesNonExemptEncryption: false
        UIRequiredDeviceCapabilities: [arm64]
        UIAppFonts: [inter_variable.ttf]
        UILaunchScreen: {}
        NSAppTransportSecurity: { NSAllowsArbitraryLoads: true }
        CFBundleURLTypes: [{ CFBundleURLName: com.tuvora.deeplink, CFBundleURLSchemes: [tuvora] }]
        CFBundleLocalizations: [en, ar, bg, bs, cs, da, de, el, es, es-419, fr, he, hi, hu, id, it, ja, lt, nb, nl, pl, pt, pt-BR, pt-PT, ro, ru, sk, sl, sq, sr-Latn, sv, ta, tr, uk, ur, vi, zh-Hans, zh-Hant]
    settings:
      base:
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../tvosCore/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "TuvoraCore", "-lsqlite3", "-lc++", "-framework", "SystemConfiguration"]
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: TuvoraTV/TuvoraTV.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
      # Same bundle IDs as the iPhone app: Universal Purchase puts Apple TV on the same App Store record.
      configs:
        Debug: { PRODUCT_BUNDLE_IDENTIFIER: com.tuvora.app }
        Release: { PRODUCT_BUNDLE_IDENTIFIER: com.tuvora.media }
    scheme:
      testTargets: [TuvoraTVTests, TuvoraTVUITests]
    preBuildScripts:
      - name: Build TuvoraCore (Kotlin)
        script: exec "$SRCROOT/Scripts/build-tuvoracore.sh"
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Copy string tables
        script: exec "$SRCROOT/Scripts/copy-string-tables.sh"
        basedOnDependencyAnalysis: false
      # Stops a wrong-platform / mismatched-minimum framework before App Store Connect does (ITMS-90208).
      - name: Check embedded frameworks
        script: exec "$SRCROOT/Scripts/check-embedded-frameworks.sh"
        basedOnDependencyAnalysis: false
      # Release only: sends the dSYM to PostHog so tvOS crash stacks symbolicate (same script as iOS;
      # it fails an archive without POSTHOG_CLI_API_KEY and only warns on a plain Release build).
      - name: Upload dSYM to PostHog
        script: exec "$SRCROOT/../iosApp/Scripts/upload-posthog-symbols.sh"
        basedOnDependencyAnalysis: false
        inputFiles: ["${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${EXECUTABLE_NAME}"]

  # Siri Remote UI tests (XCUIRemote): focus/navigation regressions on the simulator.
  TuvoraTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources: [UITests]
    dependencies:
      - target: TuvoraTV
    settings:
      base:
        TEST_TARGET_NAME: TuvoraTV
        GENERATE_INFOPLIST_FILE: YES

  # Top Shelf: Continue Watching on the Apple TV Home Screen. Reads the feed the app writes into the App Group.
  TuvoraTopShelf:
    type: app-extension
    platform: tvOS
    sources: [TopShelf/Sources, Shared]
    info:
      path: TopShelf/Info.plist
      properties:
        CFBundleDisplayName: Tuvora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIRequiredDeviceCapabilities: [arm64]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: TopShelf/TopShelf.entitlements
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug: { PRODUCT_BUNDLE_IDENTIFIER: com.tuvora.app.topshelf }
        Release: { PRODUCT_BUNDLE_IDENTIFIER: com.tuvora.media.topshelf }

  TuvoraTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources: [TuvoraTVTests]
    dependencies: [{ target: TuvoraTV }]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
